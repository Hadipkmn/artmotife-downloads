name: Native companion release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact private source commit or reviewed ref
        required: true
        default: main
      qualification_run_id:
        description: Optional successful component qualification run to promote without rebuilding
        required: false
      tooling_sha:
        description: Exact reviewed release-tooling commit for qualified promotion
        required: false
      windows_baseline_tag:
        description: Previous Stable Windows tag to retain; set only for Windows-only promotion
        required: false
      windows_qualification_workflow_sha:
        description: Exact downloads-repo main commit used by the successful Windows qualification
        required: false
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  actions: read

env:
  ARTMOTIFE_PRIMARY_REPOSITORY: ${{ github.workspace }}/source

concurrency:
  group: native-companion-release
  cancel-in-progress: false

jobs:
  promote-qualified:
    if: ${{ inputs.qualification_run_id != '' && !inputs.windows_baseline_tag && !inputs.windows_qualification_workflow_sha }}
    uses: ./.github/workflows/promote-qualified-core.yml
    with:
      source_sha: ${{ inputs.source_ref }}
      tooling_sha: ${{ inputs.tooling_sha }}
      qualification_run_id: ${{ inputs.qualification_run_id }}
    secrets: inherit
  promote-qualified-windows:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.windows_baseline_tag != '' || inputs.windows_qualification_workflow_sha != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QUALIFIED_SOURCE: ${{ inputs.source_ref }}
      QUALIFICATION_RUN: ${{ inputs.qualification_run_id }}
      QUALIFICATION_WORKFLOW_SHA: ${{ inputs.windows_qualification_workflow_sha }}
      WINDOWS_BASELINE_TAG: ${{ inputs.windows_baseline_tag }}
      TOOLING_SHA: ${{ inputs.tooling_sha }}
    steps:
      - name: Require the exact successful official Windows qualification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_REPOSITORY" == Hadipkmn/artmotife-downloads ]]
          [[ "$QUALIFIED_SOURCE" =~ ^[a-f0-9]{40}$ && "$TOOLING_SHA" == "$QUALIFIED_SOURCE" ]]
          [[ "$QUALIFICATION_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ && "$QUALIFICATION_RUN" =~ ^[1-9][0-9]{0,15}$ ]]
          [[ "$WINDOWS_BASELINE_TAG" =~ ^connector-v1\.1\.[0-9]+-windows-x64$ ]]
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN")
          jq -e --arg sha "$QUALIFICATION_WORKFLOW_SHA" '.conclusion == "success" and .status == "completed" and .head_branch == "main" and .head_sha == $sha and .path == ".github/workflows/windows-qualified-core.yml" and .event == "workflow_dispatch"' <<< "$run" >/dev/null
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN/jobs")
          jq -e '([.jobs[] | .name] | sort) == ["publish-components","qualify-and-sign"] and all(.jobs[]; .conclusion == "success")' <<< "$jobs" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN/artifacts" --jq '.artifacts | map(select(.name == "qualified-core-windows" and .expired == false)) | length' | grep -x 1 >/dev/null
      - uses: actions/checkout@v4
        with:
          repository: Hadipkmn/artmotife-private
          ref: main
          ssh-key: ${{ secrets.ARTMOTIFE_PRIVATE_SOURCE_KEY }}
          persist-credentials: false
          path: tooling
          sparse-checkout: |
            connector-app
            scripts
      - name: Verify reviewed private source is still current main
        run: test "$(git -C tooling rev-parse HEAD)" = "$QUALIFIED_SOURCE"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --prefix tooling/connector-app
      - run: node --test tooling/scripts/publish-windows-stable-core.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: qualified-core-windows
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify all draft assets before advancing Windows Stable
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./tooling/connector-app/package.json').version")
          node tooling/scripts/publish-windows-stable-core.mjs candidate "$RUNNER_TEMP/windows-stable" "$QUALIFIED_SOURCE" "$QUALIFICATION_RUN" "$version" "$WINDOWS_BASELINE_TAG"
  preflight:
    if: ${{ !inputs.qualification_run_id && !inputs.windows_baseline_tag && !inputs.windows_qualification_workflow_sha }}
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      connector_version: ${{ steps.release.outputs.connector_version }}
      collector_version: ${{ steps.release.outputs.collector_version }}
      tag: ${{ steps.release.outputs.tag }}
      should_publish: ${{ steps.release.outputs.should_publish }}
    steps:
      - name: Check out reviewed private source
        uses: actions/checkout@v4
        with:
          repository: Hadipkmn/artmotife-private
          ref: ${{ inputs.source_ref || 'main' }}
          ssh-key: ${{ secrets.ARTMOTIFE_PRIVATE_SOURCE_KEY }}
          persist-credentials: false
          path: source
      - name: Resolve exact release identity
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          source_sha="$(git -C source rev-parse HEAD)"
          connector_version="$(node -p "require('./source/connector-app/package.json').version")"
          collector_version="$(node -p "require('./source/collector-extension/manifest.json').version")"
          tag="connector-v${connector_version}-collector-v${collector_version}"
          should_publish=true
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            should_publish=false
          fi
          if [ "$should_publish" = true ]; then
            echo 'New Connector releases require qualification_run_id and pinned tooling_sha; unqualified rebuild publication is disabled.'
            exit 1
          fi
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "connector_version=${connector_version}" >> "$GITHUB_OUTPUT"
          echo "collector_version=${collector_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${should_publish}" >> "$GITHUB_OUTPUT"

  build-connector:
    needs: preflight
    if: needs.preflight.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            build_command: npm run build:win --prefix source/connector-app -- --publish never
          - platform: macos
            runner: macos-15-intel
            build_command: npm run build:mac --prefix source/connector-app -- --universal --publish never
          - platform: linux
            runner: ubuntu-latest
            build_command: npm run build:linux --prefix source/connector-app -- AppImage --x64 --publish never
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact private source
        uses: actions/checkout@v4
        with:
          repository: Hadipkmn/artmotife-private
          ref: ${{ needs.preflight.outputs.source_sha }}
          ssh-key: ${{ secrets.ARTMOTIFE_PRIVATE_SOURCE_KEY }}
          persist-credentials: false
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/connector-app/package-lock.json
      - name: Install Connector dependencies
        run: npm ci --prefix source/connector-app
      - name: Normalize macOS package icon
        if: matrix.platform == 'macos'
        shell: bash
        run: sips -z 512 512 source/connector-app/assets/icon.png --out source/connector-app/assets/icon.png
      - name: Build native Connector package
        run: ${{ matrix.build_command }}
      - name: Normalize Linux architecture label
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          version="${{ needs.preflight.outputs.connector_version }}"
          mv \
            "source/connector-app/dist/ArtMotife-Connector-${version}-linux-x86_64.AppImage" \
            "source/connector-app/dist/ArtMotife-Connector-${version}-linux-x64.AppImage"
      - name: Prepare immutable artifact and stable latest alias
        run: >-
          node source/scripts/prepare-companion-release-assets.mjs
          --platform ${{ matrix.platform }}
          --source connector-app/dist
          --output ../release-assets/${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.platform }}
          path: release-assets/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 14

  build-collector:
    needs: preflight
    if: needs.preflight.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact private source
        uses: actions/checkout@v4
        with:
          repository: Hadipkmn/artmotife-private
          ref: ${{ needs.preflight.outputs.source_sha }}
          ssh-key: ${{ secrets.ARTMOTIFE_PRIVATE_SOURCE_KEY }}
          persist-credentials: false
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/ui/package-lock.json
      - name: Install Studio packaging dependencies
        run: npm ci --prefix source/ui
      - name: Build versioned Collector package
        run: node source/ui/scripts/package-collector-extension.mjs
      - name: Prepare immutable package and stable latest alias
        run: >-
          node source/scripts/prepare-companion-release-assets.mjs
          --platform collector
          --source ui/public/downloads
          --output ../release-assets/collector
      - uses: actions/upload-artifact@v4
        with:
          name: companion-collector
          path: release-assets/collector/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [preflight, build-connector, build-collector]
    if: needs.preflight.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: companion-*
          path: release-assets
          merge-multiple: true
      - name: Bind complete native release manifest
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        shell: bash
        run: |
          jq -s --arg sourceCommit "$SOURCE_SHA" \
            '{schemaVersion: 1, sourceCommit: $sourceCommit, platforms: .}' \
            release-assets/release-manifest-*.json > release-assets/companion-release-manifest.json
      - name: Publish exact release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          CONNECTOR_VERSION: ${{ needs.preflight.outputs.connector_version }}
          COLLECTOR_VERSION: ${{ needs.preflight.outputs.collector_version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ArtMotife Connector ${CONNECTOR_VERSION} · Collector ${COLLECTOR_VERSION}" \
            --notes "Native companion release from reviewed private source commit ${SOURCE_SHA}. Includes immutable versioned files, stable latest aliases, checksums, updater metadata, and a combined release manifest." \
            --latest
          if ! gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber; then
            gh release delete "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --cleanup-tag \
              --yes
            exit 1
          fi
